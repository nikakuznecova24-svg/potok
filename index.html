    const POTOK_TOKEN = 'PquJQRe-R5A5_Gxc9r9meDRjKJ7NihHA7X9rzY5dD-c';

    window.storage = {
      async get(key) {
        try {
          const res = await fetch(POTOK_API + '/kv/' + encodeURIComponent(key), {
            headers: { 'X-Potok-Token': POTOK_TOKEN }
          });
          if (res.status === 404) return null;
          const data = await res.json();
          if (data.value === null || data.value === undefined) return null;
          return { key, value: data.value };
        } catch (e) {
          console.error('storage.get failed', e);
          return null;
        }
      },
      async set(key, value) {
        try {
          const res = await fetch(POTOK_API + '/kv/' + encodeURIComponent(key), {
            method: 'PUT',
            headers: { 'X-Potok-Token': POTOK_TOKEN },
            body: value
          });
          await res.json();
        } catch (e) {
          console.error('storage.set failed', e);
        }
        return { key, value };
      },
      async delete(key) {
        try {
          await fetch(POTOK_API + '/kv/' + encodeURIComponent(key), {
            method: 'DELETE',
            headers: { 'X-Potok-Token': POTOK_TOKEN }
          });
        } catch (e) {
          console.error('storage.delete failed', e);
        }
        return { key, deleted: true };
      },
      async list(prefix) {
        try {
          const res = await fetch(POTOK_API + '/kv?prefix=' + encodeURIComponent(prefix || ''), {
            headers: { 'X-Potok-Token': POTOK_TOKEN }
          });
          const data = await res.json();
          return { keys: data.keys || [] };
        } catch (e) {
          console.error('storage.list failed', e);
          return { keys: [] };
        }
      }
    };
